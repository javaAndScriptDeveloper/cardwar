# Reverse proxy and TLS termination for Cardwar.
#
# Certificates: /etc/nginx/certs/fullchain.pem and /etc/nginx/certs/privkey.pem. `make certs` writes a self-signed
# pair there for local and first-boot use. For production, mount a real certificate at the same two paths — with
# certbot that is the /etc/letsencrypt/live/<domain>/ directory, which uses exactly these file names.
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 512;

    # JSON so Grafana Alloy ships it to Loki like the application's logs; request_id joins it to the app's lines.
    log_format json escape=json '{"time":"$time_iso8601","level":"INFO","requestId":"$request_id",'
        '"remote":"$remote_addr","method":"$request_method","uri":"$uri","status":$status,'
        '"bytes":$body_bytes_sent,"duration":$request_time,"userAgent":"$http_user_agent"}';
    access_log /var/log/nginx/access.log json;

    upstream app {
        server app:8080;
        keepalive 16;
    }

    # Plain HTTP serves only the ACME challenge (so certbot can renew while nginx holds port 80) and redirects
    # everything else. Nothing of the application is served in the clear.
    server {
        listen 80;
        server_name _;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type text/plain;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;

        # Answered by nginx itself, so the compose healthcheck reflects nginx and not the upstream.
        location = /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # Server-sent events: no buffering, no early timeout, HTTP/1.1 keepalive to the upstream. Without these
        # nginx holds events back until its buffer fills and drops the connection after 60 seconds of silence.
        # Metrics are for Grafana Alloy on the compose network only; from outside they do not exist.
        location ~ ^/actuator/(prometheus|metrics) {
            return 404;
        }

        location ~ ^/api/v1/duels/[^/]+/events$ {
            proxy_pass http://app;
            proxy_set_header X-Request-Id $request_id;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            chunked_transfer_encoding on;
        }

        # The Mini App client, built into this image (nginx/Dockerfile). Same origin as /api: no CORS, one certificate.
        # add_header does not inherit into a location that sets its own, so each one repeats the security headers.
        # X-Frame-Options DENY is replaced here by CSP frame-ancestors: Telegram Web embeds Mini Apps in an iframe.
        # img-src allows t.me: Telegram profile photos (initData user.photo_url) are served from there.
        location = /app {
            return 301 /app/;
        }

        # Content-hashed bundles: a new build has new names, so they can be cached forever.
        location ^~ /app/assets/ {
            root /usr/share/nginx/html;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header X-Content-Type-Options nosniff always;
        }

        location ^~ /app/ {
            root /usr/share/nginx/html;
            # Client-side routes all render the one shell.
            try_files $uri /app/index.html;
            add_header Cache-Control "no-cache" always;
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy no-referrer always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://telegram.org; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://t.me; connect-src 'self'; frame-ancestors 'self' https://web.telegram.org https://*.telegram.org; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        }

        location / {
            proxy_pass http://app;
            proxy_set_header X-Request-Id $request_id;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 60s;
        }
    }
}
