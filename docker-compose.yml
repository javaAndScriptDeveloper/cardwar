# The Cardwar stack: Postgres for accounts, catalog and finished duels; Redis for in-progress duel state and the
# per-duel event channel; the application; and nginx as the only service that publishes ports to the host.
#
# - `db` and `redis` start by default. spring-boot-docker-compose manages them on `./gradlew bootRun`, and
#   docker-compose.override.yml publishes them on the loopback interface for that local case only.
# - `app` and `nginx` are gated behind the `full` profile, so bootRun's compose integration never builds the image.
#   Bring up the whole stack with `make up`, which passes `-f docker-compose.yml` so the dev override is NOT loaded
#   and nothing but nginx reaches the host network.
#
# Tests use their own throwaway containers via Testcontainers — no service here is for them.
services:
  db:
    image: postgres:17-alpine
    container_name: cardwar-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cardwar}
      POSTGRES_USER: ${POSTGRES_USER:-cardwar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (see .env.example)}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cardwar} -d ${POSTGRES_DB:-cardwar}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: cardwar-redis
    # Password required for every command; append-only file so in-progress duels survive a restart.
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD must be set (see .env.example)}
      - --appendonly
      - "yes"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      # Authenticated ping: an unauthenticated one would report healthy on a misconfigured, open server.
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    profiles: ["full"]
    build:
      context: .
    image: cardwar
    container_name: cardwar-app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Reachable from nginx on the compose network only. Deliberately no `ports:` — TLS is terminated by nginx.
    expose:
      - "8080"
    environment:
      APP_NAME: ${APP_NAME:-cardwar}
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: prod
      # Reach the datastores by their compose service names, not localhost.
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-cardwar}
      DB_USERNAME: ${POSTGRES_USER:-cardwar}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set (see .env.example)}
      JWT_TTL: ${JWT_TTL:-2h}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN must be set (see .env.example)}
      TELEGRAM_INIT_DATA_MAX_AGE: ${TELEGRAM_INIT_DATA_MAX_AGE:-1h}
      DUEL_STATE_TTL: ${DUEL_STATE_TTL:-2h}
      DUEL_INVITE_TTL: ${DUEL_INVITE_TTL:-15m}
    healthcheck:
      # Readiness, not liveness: the container is healthy only once it can actually serve a request.
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 45s
    restart: unless-stopped

  nginx:
    profiles: ["full"]
    # nginx plus the built Mini App client (nginx/Dockerfile), served at /app/ on the same origin as /api.
    build:
      context: .
      dockerfile: nginx/Dockerfile
    image: cardwar-nginx:local
    container_name: cardwar-nginx
    depends_on:
      app:
        condition: service_healthy
    # The ONLY published ports in the stack.
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Self-signed from `make certs` for local use. For production, mount the real certificate and key at the
      # same paths — e.g. a certbot volume: /etc/letsencrypt/live/<domain>:/etc/nginx/certs:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      # Webroot for Let's Encrypt renewals: certbot writes the challenge here, nginx serves it on port 80.
      - ./nginx/acme:/var/www/certbot:ro
    healthcheck:
      # 127.0.0.1 rather than localhost: inside the container localhost resolves to ::1 first and nginx binds IPv4.
      test: ["CMD-SHELL", "wget -qO- --no-check-certificate https://127.0.0.1/healthz | grep -q ok"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  db-data:
  redis-data:
