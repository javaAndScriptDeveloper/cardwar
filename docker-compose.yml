# The Cardwar stack: Postgres for accounts, catalog and finished duels; Redis for in-progress duel state and the
# per-duel event channel; the application; and nginx as the only service that publishes ports to the host.
#
# - `db` and `redis` start by default. spring-boot-docker-compose manages them on `./gradlew bootRun`, and
#   docker-compose.override.yml publishes them on the loopback interface for that local case only.
# - `app` and `nginx` are gated behind the `full` profile, so bootRun's compose integration never builds the image.
#   Bring up the whole stack with `make up`, which passes `-f docker-compose.yml` so the dev override is NOT loaded
#   and nothing but nginx reaches the host network.
#
# Tests use their own throwaway containers via Testcontainers — no service here is for them.
services:
  db:
    image: postgres:17-alpine
    container_name: cardwar-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cardwar}
      POSTGRES_USER: ${POSTGRES_USER:-cardwar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (see .env.example)}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cardwar} -d ${POSTGRES_DB:-cardwar}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: cardwar-redis
    # Password required for every command; append-only file so in-progress duels survive a restart.
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD must be set (see .env.example)}
      - --appendonly
      - "yes"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      # Authenticated ping: an unauthenticated one would report healthy on a misconfigured, open server.
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    profiles: ["full"]
    build:
      context: .
    image: cardwar
    container_name: cardwar-app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Reachable from nginx on the compose network only. Deliberately no `ports:` — TLS is terminated by nginx.
    expose:
      - "8080"
    environment:
      APP_NAME: ${APP_NAME:-cardwar}
      SERVER_PORT: 8080
      SPRING_PROFILES_ACTIVE: prod
      # Reach the datastores by their compose service names, not localhost.
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-cardwar}
      DB_USERNAME: ${POSTGRES_USER:-cardwar}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set (see .env.example)}
      JWT_TTL: ${JWT_TTL:-2h}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN must be set (see .env.example)}
      TELEGRAM_INIT_DATA_MAX_AGE: ${TELEGRAM_INIT_DATA_MAX_AGE:-1h}
      TELEGRAM_MINI_APP_URL: https://${DOMAIN:-localhost}/app/
      DUEL_STATE_TTL: ${DUEL_STATE_TTL:-2h}
      DUEL_INVITE_TTL: ${DUEL_INVITE_TTL:-15m}
    healthcheck:
      # Readiness, not liveness: the container is healthy only once it can actually serve a request.
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 45s
    restart: unless-stopped

  nginx:
    profiles: ["full"]
    # nginx plus the built Mini App client (nginx/Dockerfile), served at /app/ on the same origin as /api.
    build:
      context: .
      dockerfile: nginx/Dockerfile
      args:
        TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
        TELEGRAM_APP_NAME: ${TELEGRAM_APP_NAME:-}
    image: cardwar-nginx:local
    container_name: cardwar-nginx
    depends_on:
      app:
        condition: service_healthy
    # The ONLY published ports in the stack.
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    # The config is read from a mounted directory, not a single mounted file: `git pull` replaces nginx.conf with
    # a new inode, and a file bind mount would keep showing the old one, so a reload would re-read stale config.
    command: ["nginx", "-c", "/etc/nginx/cardwar/nginx.conf", "-g", "daemon off;"]
    volumes:
      - ./nginx/conf:/etc/nginx/cardwar:ro
      # Self-signed from `make certs` for local use. For production, mount the real certificate and key at the
      # same paths — e.g. a certbot volume: /etc/letsencrypt/live/<domain>:/etc/nginx/certs:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      # Webroot for Let's Encrypt renewals: certbot writes the challenge here, nginx serves it on port 80.
      - ./nginx/acme:/var/www/certbot:ro
    healthcheck:
      # 127.0.0.1 rather than localhost: inside the container localhost resolves to ::1 first and nginx binds IPv4.
      test: ["CMD-SHELL", "wget -qO- --no-check-certificate https://127.0.0.1/healthz | grep -q ok"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # --- observability (docs/observability.md) ---------------------------------------------------------------
  # Alloy scrapes the app over the compose network and tails every container's logs through the Docker socket,
  # then pushes both outbound. Production enables it with COMPOSE_PROFILES=observability and the GRAFANA_CLOUD_*
  # variables in .env; nothing here publishes a port.
  alloy:
    profiles: ["observability"]
    image: grafana/alloy:v1.10.0
    container_name: cardwar-alloy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Read-only: Alloy only lists containers and reads their logs.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # The remote-write WAL survives a restart, so a short Grafana Cloud outage loses no samples.
      - alloy-data:/var/lib/alloy/data
    environment:
      GRAFANA_CLOUD_PROM_URL: ${GRAFANA_CLOUD_PROM_URL:-}
      GRAFANA_CLOUD_PROM_USER: ${GRAFANA_CLOUD_PROM_USER:-}
      GRAFANA_CLOUD_PROM_TOKEN: ${GRAFANA_CLOUD_PROM_TOKEN:-}
      GRAFANA_CLOUD_LOKI_URL: ${GRAFANA_CLOUD_LOKI_URL:-}
      GRAFANA_CLOUD_LOKI_USER: ${GRAFANA_CLOUD_LOKI_USER:-}
      GRAFANA_CLOUD_LOKI_TOKEN: ${GRAFANA_CLOUD_LOKI_TOKEN:-}
      CARDWAR_ENV: ${CARDWAR_ENV:-local}
      # Compose does not export its resolved project name for interpolation, so whoever runs compose passes it
      # (`make observability-up` does); otherwise Docker discovery filters on the wrong label and tails nothing.
      CARDWAR_COMPOSE_PROJECT: ${CARDWAR_COMPOSE_PROJECT:-cardwar}
      APP_METRICS_HOST: app
    mem_limit: 128m
    restart: unless-stopped

  # Local harness only (`make observability-up`): a throwaway Prometheus, Loki and Grafana standing in for Grafana
  # Cloud. docker-compose.observability-local.yml points Alloy at them and publishes their ports on the laptop.
  prometheus:
    profiles: ["observability-local"]
    image: prom/prometheus:v3.1.0
    container_name: cardwar-prometheus
    command:
      # No scrape config of its own: Alloy pushes into it, exactly as it pushes to Grafana Cloud.
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
      - --storage.tsdb.retention.time=24h
    volumes:
      - ./observability/local/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  loki:
    profiles: ["observability-local"]
    image: grafana/loki:3.5.0
    container_name: cardwar-loki
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./observability/local/loki.yml:/etc/loki/loki.yml:ro

  grafana:
    profiles: ["observability-local"]
    image: grafana/grafana:11.5.1
    container_name: cardwar-grafana
    depends_on:
      - prometheus
      - loki
    environment:
      # A local throwaway with nothing worth protecting; a login screen only slows a check down.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./observability/local/grafana-datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./observability/local/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      # The very same files `make dashboards` / `make alerting` push to Grafana Cloud.
      - ./observability/grafana:/var/lib/grafana/dashboards:ro
      - ./observability/grafana/alerting:/etc/grafana/provisioning/alerting:ro

volumes:
  db-data:
  redis-data:
  alloy-data:
