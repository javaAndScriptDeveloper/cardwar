spring:
  # Datasource is provided at runtime by Testcontainers via @ServiceConnection (see TestcontainersConfiguration).
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml
  # Tests own their PostgreSQL through Testcontainers, so the docker-compose integration stays off.
  docker:
    compose:
      enabled: false

cardwar:
  security:
    jwt:
      # A fixed, obviously-fake test secret. Production has no default at all and refuses to start without one.
      secret: dGVzdC1vbmx5LXNlY3JldC1ub3QtZm9yLXByb2R1Y3Rpb24tdXNl
      ttl: 15m
    telegram:
      # Matches TelegramInitDataSigner.BOT_TOKEN, which signs test initData. Not a real bot.
      bot-token: "123456789:TEST-ONLY-not-a-real-bot-token"
    rate-limit:
      # Effectively off for the suite; the throttling test asks for its own tight limits and its own context.
      capacity: 100000
      auth-capacity: 100000
  bot:
    # Nothing listens here: replies fail fast and are swallowed, so tests never reach the real Bot API.
    api-url: http://127.0.0.1:9
  duel:
    # The schedulers would otherwise act on other tests' duels mid-assertion; tests drive timeouts and the
    # stake sweep explicitly with an instant instead.
    clock-tick: 1h
    stake-sweep-interval: 1h
    stream:
      # A heartbeat every second so the idle-stream test does not wait for the production interval.
      heartbeat: 1s

logging:
  level:
    org.testcontainers: INFO
    com.github.dockerjava: WARN
