spring:
  application:
    name: ${APP_NAME:cardwar}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cardwar}
    username: ${DB_USERNAME:cardwar}
    password: ${DB_PASSWORD:cardwar}
    hikari:
      pool-name: cardwar-cp
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Liquibase; Hibernate only validates it matches the entities.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s

  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml

  cache:
    type: caffeine
    # Declare the cache names up front so @Cacheable misses fail fast instead of creating caches lazily.
    cache-names: default,catalog
    caffeine:
      spec: maximumSize=500,expireAfterWrite=5m

  # spring-boot-docker-compose starts docker-compose.yml automatically on `bootRun`.
  docker:
    compose:
      enabled: true
      lifecycle-management: start-and-stop

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  # The rate limiter keys unauthenticated and /api/v1/auth/** callers on the remote address. Behind nginx every
  # request arrives from nginx's address, so without this all clients would share one auth bucket. "native" lets
  # Tomcat's RemoteIpValve rewrite the remote address from X-Forwarded-For, but only when the request comes from
  # a trusted proxy: Tomcat's default server.tomcat.remoteip.internal-proxies already covers loopback and the
  # RFC1918 ranges the compose network uses, so it is deliberately not widened here.
  forward-headers-strategy: native
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      # Auth is wired in, so health details are only for authenticated callers.
      show-details: when-authorized
      probes:
        enabled: true
  info:
    env:
      enabled: true

cardwar:
  security:
    jwt:
      # No default on purpose. A defaulted signing secret looks like authentication without being it,
      # so the prod profile fails startup when this is missing (see JwtProperties).
      secret: ${JWT_SECRET:}
      ttl: ${JWT_TTL:2h}
      issuer: cardwar
    telegram:
      # The bot's token from BotFather: the HMAC key Telegram signs Mini App initData with. No default; the prod
      # profile refuses to start without it, and elsewhere a missing token rejects every Telegram sign-in.
      bot-token: ${TELEGRAM_BOT_TOKEN:}
      # A signed initData is a login; this bounds how long a leaked one stays usable.
      init-data-max-age: ${TELEGRAM_INIT_DATA_MAX_AGE:1h}
    rate-limit:
      # General API bucket, per authenticated principal.
      capacity: ${RATE_LIMIT_CAPACITY:120}
      refill-period: ${RATE_LIMIT_REFILL_PERIOD:1m}
      # Stricter bucket for /api/v1/auth/**, keyed on client address.
      auth-capacity: ${RATE_LIMIT_AUTH_CAPACITY:10}
      auth-refill-period: ${RATE_LIMIT_AUTH_REFILL_PERIOD:1m}
  duel:
    # Abandoned duels expire on their own; refreshed on every accepted move.
    state-ttl: ${DUEL_STATE_TTL:2h}
    # How long a shared invite can be accepted. Fixed at creation, never refreshed.
    invite-ttl: ${DUEL_INVITE_TTL:15m}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    cardwar: DEBUG
