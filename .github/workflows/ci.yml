name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check formatting
        run: ./gradlew spotlessCheck

      - name: Build & test
        # Docker is available on ubuntu-latest, so Testcontainers works out of the box.
        run: ./gradlew build

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/
          if-no-files-found: ignore

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/reports/jacoco/
          if-no-files-found: ignore

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Grafana dashboards match their generator and the exported metrics
        working-directory: .
        run: node --test observability/grafana/build.test.mjs

      - name: LoRA art pipeline helpers match the rosters
        working-directory: .
        run: node --test art/lora/personas.test.mjs && python3 -m unittest discover -s art/lora/pod

  # The whole stack as `make up` builds it (nginx with the client, app, Postgres, Redis), then the API smoke test and
  # two browsers playing a duel through the Mini App. Slow by nature; it runs beside the build, not inside it.
  client-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies and Chromium
        working-directory: client
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Start the stack
        run: |
          cp .env.example .env
          make certs
          make up

      - name: Two players play a duel through the Mini App
        # Before the smoke test: its login flood drains the per-address auth bucket for a minute.
        working-directory: client
        run: npm run e2e

      - name: API smoke test
        # The E2E specs sign in several times; the auth bucket is 10 per minute per address, so let it refill first.
        run: sleep 65 && scripts/smoke.sh

      - name: Stack logs
        if: failure()
        run: docker compose -f docker-compose.yml --env-file .env --profile full logs --tail=300

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: client/playwright-report/
          if-no-files-found: ignore

  # Report-only by design and deliberately its own job: the scan pulls the NVD advisory feed, and a feed outage
  # or a slow first sync must never be able to fail the build job above.
  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache the NVD data feed
        uses: actions/cache@v4
        with:
          path: ~/.gradle/dependency-check-data
          key: nvd-${{ runner.os }}-${{ github.run_id }}
          restore-keys: nvd-${{ runner.os }}-

      - name: Scan dependencies for known vulnerabilities
        continue-on-error: true
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./gradlew dependencyCheckAnalyze

      - name: Upload dependency-check report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: build/reports/dependency-check-report.*
          if-no-files-found: ignore
